<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Wavecrest Pro</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F7F3EC; --bg-card: #FFFFFF; --bg-dark: #0D0C0A; --bg-surface: #161410;
      --ink: #111008; --ink-mid: #6B6356; --ink-light: #9C9284;
      --accent: #C4501A; --green: #2D9E6B;
      --border: #D4CCBA; --border-dark: rgba(255,255,255,.09);
    }
    body { background: var(--bg-dark); color: white; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; -webkit-font-smoothing: antialiased; }

    /* Logo */
    .logo { font-family: 'Fraunces', serif; font-size: 1.1rem; font-weight: 700; color: white; text-decoration: none; letter-spacing: -.01em; display: block; text-align: center; margin-bottom: 40px; }
    .logo span { color: var(--accent); }

    /* Card */
    .auth-card { width: 100%; max-width: 400px; background: var(--bg-surface); border: 1px solid var(--border-dark); border-radius: 16px; padding: 36px 32px; }
    .auth-title { font-family: 'Fraunces', serif; font-size: 1.5rem; font-weight: 800; letter-spacing: -.03em; margin-bottom: 6px; }
    .auth-sub { font-size: 13.5px; color: rgba(255,255,255,.38); margin-bottom: 28px; line-height: 1.5; }

    /* OAuth buttons */
    .oauth-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 11px 16px; border-radius: 8px; border: 1px solid var(--border-dark); background: rgba(255,255,255,.05); color: rgba(255,255,255,.85); font-size: 14px; font-weight: 500; font-family: 'Inter', sans-serif; cursor: pointer; transition: background .15s, border-color .15s; text-decoration: none; margin-bottom: 10px; }
    .oauth-btn:hover { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.14); }

    /* Divider */
    .or-divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
    .or-divider::before, .or-divider::after { content: ''; flex: 1; height: 1px; background: var(--border-dark); }
    .or-divider span { font-size: 11.5px; color: rgba(255,255,255,.22); font-family: 'IBM Plex Mono', monospace; letter-spacing: .08em; }

    /* Form */
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 500; color: rgba(255,255,255,.45); margin-bottom: 6px; letter-spacing: .03em; }
    .field input { width: 100%; background: rgba(255,255,255,.05); border: 1px solid var(--border-dark); border-radius: 7px; padding: 11px 14px; font-family: 'Inter', sans-serif; font-size: 14px; color: white; outline: none; transition: border-color .15s; }
    .field input::placeholder { color: rgba(255,255,255,.2); }
    .field input:focus { border-color: rgba(255,255,255,.22); background: rgba(255,255,255,.07); }
    .field-row { display: flex; justify-content: space-between; align-items: center; }
    .forgot { font-size: 12px; color: rgba(255,255,255,.3); text-decoration: none; transition: color .15s; }
    .forgot:hover { color: rgba(255,255,255,.55); }

    /* Submit */
    .submit-btn { width: 100%; padding: 12px; border-radius: 8px; background: white; color: var(--ink); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; border: none; cursor: pointer; transition: background .15s; margin-top: 20px; }
    .submit-btn:hover { background: #F0EDE6; }
    .submit-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* Footer links */
    .auth-footer { margin-top: 22px; text-align: center; font-size: 13px; color: rgba(255,255,255,.28); }
    .auth-footer a { color: rgba(255,255,255,.55); text-decoration: none; }
    .auth-footer a:hover { color: white; }

    /* Error */
    .form-error { font-size: 12px; color: #F4917A; margin-top: 10px; display: none; }
    .form-error.visible { display: block; }

    /* Back link */
    .back-link { font-size: 13px; color: rgba(255,255,255,.25); text-decoration: none; display: flex; align-items: center; gap: 5px; margin-bottom: 32px; transition: color .15s; }
    .back-link:hover { color: rgba(255,255,255,.5); }
  </style>
</head>
<body>

  <a href="/" class="back-link">← Back to site</a>

  <a href="/" class="logo">Wavecrest <span>Pro</span></a>

  <div class="auth-card">
    <h1 class="auth-title">Sign in</h1>
    <p class="auth-sub">Welcome back. Your analyses are waiting.</p>

    <!-- Google OAuth -->
    <a href="/api/auth/google" class="oauth-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </a>

    <!-- GitHub OAuth -->
    <a href="/api/auth/github" class="oauth-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="rgba(255,255,255,.75)">
        <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/>
      </svg>
      Continue with GitHub
    </a>

    <div class="or-divider"><span>or</span></div>

    <!-- Email/password form -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@company.com" required autocomplete="email" />
      </div>
      <div class="field">
        <div class="field-row">
          <label for="password">Password</label>
          <a href="/forgot-password" class="forgot">Forgot password?</a>
        </div>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <p class="form-error" id="login-error"></p>
      <button type="submit" class="submit-btn" id="login-btn">Sign in</button>
    </form>
  </div>

  <p class="auth-footer">
    No account? <a href="/pricing">Start free →</a>
  </p>
  <p style="margin-top:16px;font-size:11.5px;color:rgba(255,255,255,.14);font-family:'IBM Plex Mono',monospace;text-align:center">
    By signing in you agree to our <a href="#" style="color:rgba(255,255,255,.22);text-decoration:none">Terms</a> and <a href="#" style="color:rgba(255,255,255,.22);text-decoration:none">Privacy Policy</a>
  </p>

<script>
  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const errorEl = document.getElementById('login-error');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.textContent = 'Signing in…';
    errorEl.classList.remove('visible');

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Invalid email or password');
      window.location.href = data.redirect || '/app';
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.add('visible');
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  }
</script>
</body>
</html>
