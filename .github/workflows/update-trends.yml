name: Update Trends

on:
  schedule:
    # Runs daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-trends:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run trend updater
        run: python3 update-trends.py

      - name: Commit and push if changed
        run: |
          git config user.name "Xc00lcapyNovaX"
          git config user.email "efeali.bel@gmail.com"
          git add public/trends.json
          git diff --cached --quiet || git commit -m "Update daily trends $(date -u +%Y-%m-%d)"
          git push

      - name: Ping server to seed new trends into DB
        run: |
          curl -s -X POST https://wavecrest.pro/api/trends/seed \
            -H "x-seed-secret: ${{ secrets.SEED_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            || echo "Seed ping failed (non-fatal)"
